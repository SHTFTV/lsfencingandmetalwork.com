name: deploy-s3

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bucket:
        description: S3 bucket name (overrides secrets.S3_BUCKET)
        required: false
      object_key:
        description: S3 object key for the dist archive (overrides secrets.S3_OBJECT_KEY)
        required: false
      aws_region:
        description: AWS region (overrides secrets.AWS_REGION)
        required: false
      max_attempts:
        description: Maximum PutObject attempts
        required: false
        default: "6"

concurrency:
  # Serialize per bucket+key across all runs of this workflow on this ref.
  # Cross-workflow / cross-repo serialization is enforced by the S3 lock object.
  group: s3-dist-upload-${{ github.event.inputs.bucket || secrets.S3_BUCKET }}-${{ github.event.inputs.object_key || secrets.S3_OBJECT_KEY }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region || secrets.AWS_REGION }}

      - name: Upload dist.tar.gz to S3 with throttling diagnostics
        env:
          AWS_REGION: ${{ github.event.inputs.aws_region || secrets.AWS_REGION }}
          S3_BUCKET: ${{ github.event.inputs.bucket || secrets.S3_BUCKET }}
          S3_OBJECT_KEY: ${{ github.event.inputs.object_key || secrets.S3_OBJECT_KEY }}
          S3_UPLOAD_MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '6' }}
          S3_UPLOAD_BASE_DELAY_SECONDS: "2"
          S3_UPLOAD_MAX_DELAY_SECONDS: "60"
          S3_LOCK_HOLDER: "${{ github.repository }}@${{ github.run_id }}-${{ github.run_attempt }}"
        run: bun run deploy:s3
