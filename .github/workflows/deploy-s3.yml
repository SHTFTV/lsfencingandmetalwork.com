name: deploy-s3

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: S3 bucket name
        required: true
      object_key:
        description: S3 object key for the dist archive, for example previews/site/dist.tar.gz
        required: true
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      max_attempts:
        description: Maximum PutObject attempts
        required: true
        default: "6"

concurrency:
  group: s3-dist-upload-${{ github.event.inputs.bucket }}-${{ github.event.inputs.object_key }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Upload dist.tar.gz to S3 with throttling diagnostics
        env:
          AWS_REGION: ${{ github.event.inputs.aws_region }}
          S3_BUCKET: ${{ github.event.inputs.bucket }}
          S3_OBJECT_KEY: ${{ github.event.inputs.object_key }}
          S3_UPLOAD_MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts }}
          S3_UPLOAD_BASE_DELAY_SECONDS: "2"
          S3_UPLOAD_MAX_DELAY_SECONDS: "60"
        run: bun run deploy:s3