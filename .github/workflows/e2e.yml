name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: JSON-LD validator
        run: pnpm run validate:jsonld
      - name: Build
        # Non-secret fixture config lets global browser auth middleware create
        # its client. Intake/provider requests remain intercepted by the tests.
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/**/error-context.md
          retention-days: 14
